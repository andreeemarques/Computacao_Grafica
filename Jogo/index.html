<!DOCTYPE html>
<html>
    <head>
        <title>Metal Gear</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
            body { background: #000; color: #fff; }
            #main-menu {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 24px;
                background: rgba(0, 0, 0, 0.7) url('./Imagens/menuImagem.jpg') center/cover no-repeat;
                z-index: 1000;
                text-align: center;
            }
            #main-menu h1 {
                font-size: 3rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                margin-bottom: 0;
            }
            #main-menu button {
                padding: 14px 28px;
                font-size: 1.1rem;
                border: none;
                border-radius: 8px;
                background: #1e90ff;
                color: #fff;
                cursor: pointer;
                transition: transform 0.14s ease, background 0.14s ease;
            }
            #main-menu button:hover {
                transform: translateY(-2px);
                background: #4aa3ff;
            }
        </style>
    </head>
    <body>
        <div id="main-menu">
            <h1>Metal Gear</h1>
            <div id="camera-choice" style="display:flex; gap:16px; align-items:center; font-size:1.05rem;">
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="radio" name="camera" value="topdown" checked>
                    Câmara Top-Down
                </label>
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="radio" name="camera" value="thirdperson">
                    Câmara 3ª Pessoa
                </label>
            </div>
            <button id="start-button">Iniciar Jogo</button>
        </div>
        <script async src="https://unpkg.com/es-module-shims@2.0.10/dist/es-module-shims.js"></script>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js",
                "PointerLockControls": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/controls/PointerLockControls.js"
            }
        }
        </script>
        <script type="module" src="./JavaScript/appThree.js"></script>
    </body>
</html>
